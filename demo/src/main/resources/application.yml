spring:
  main:
    banner-mode: off

logging:
  level:
    # Shows one line per retry, with its timeline.
    io.github.mushfikafarianova.retryladder: DEBUG

# Short waits, so the demo finishes in about half a minute. The library's defaults are minutes.
retry-ladder:
  initial-delay: 2s
  multiplier: 2
  max-delay: 8s
  window: 1m
  non-retryable:
    - io.github.mushfikafarianova.retryladder.demo.BadPaymentException
  queues:
    orders: {}
    payments: {}

demo:
  downstream-down-for: 20s
  send-on-startup: true
